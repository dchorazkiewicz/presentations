<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Prezentacje — matematyka i fizyka</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/theme/black.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- deployment bootstrap -->
  <main id="catalog" class="catalog-shell">
    <header class="catalog-header">
      <div>
        <p class="eyebrow">MATEMATYKA · FIZYKA</p>
        <h1>Prezentacje</h1>
        <p class="lead">Treść jest pobierana bezpośrednio z repozytorium. Zmiana slajdów nie wymaga ponownego deploymentu strony.</p>
      </div>
      <div class="runtime-badge" title="Viewer jest wdrażany osobno od treści">
        <span class="status-dot"></span>
        runtime content
      </div>
    </header>

    <section aria-labelledby="deck-heading">
      <div class="section-heading">
        <h2 id="deck-heading">Dostępne prezentacje</h2>
        <button id="refresh-button" class="ghost-button" type="button">Odśwież listę</button>
      </div>
      <div id="deck-list" class="deck-grid" aria-live="polite"></div>
      <p id="catalog-error" class="error-message" hidden></p>
    </section>
  </main>

  <a id="home-link" class="home-link" href="./" hidden aria-label="Wróć do listy prezentacji">← Prezentacje</a>

  <div id="deck-view" class="reveal" hidden>
    <div id="slides" class="slides"></div>
  </div>

  <div id="loading" class="loading" hidden>
    <div class="spinner"></div>
    <span>Ładowanie prezentacji…</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/plugin/math/math.js"></script>
  <script src="./app.js"></script>
</body>
</html>
